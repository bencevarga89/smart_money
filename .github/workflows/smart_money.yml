name: Smart Money 13F Cluster Auditor

on:
  schedule:
    # Runs at 12:00 UTC every 5 days (1st, 6th, 11th, 16th, 21st, 26th) 
    # ONLY during peak 13F filing months: 
    # Q4 filings (Jan, Feb) | Q1 filings (Apr, May) | Q2 filings (Jul, Aug) | Q3 filings (Oct, Nov)
    - cron: '0 12 */5 1,2,4,5,7,8,10,11 *'
  
  workflow_dispatch: # Allows you to trigger manual checks instantly from the GitHub UI

jobs:
  audit-institutions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas edgartools

      - name: Run Smart Money Cluster Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python audit_smart_money.py
