name: Smart Money 13F Cluster Auditor

on:
  schedule:
    - cron: '0 12 1 * *' # Runs at 12:00 UTC on the 1st of every month
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  audit-institutions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas edgartools

      - name: Run Smart Money Cluster Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python audit_smart_money.py
